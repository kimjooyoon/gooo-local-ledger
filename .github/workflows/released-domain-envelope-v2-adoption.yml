          jq '.meta.activities_observed=0' "$WORK_DIR/base-facts.json" > "$WORK_DIR/own-unknown-predecessor-refuted-facts.json"
          bash scripts/evaluate-released-domain-envelope-v2-adoption.sh "$GITHUB_WORKSPACE" "$WORK_DIR/own-unknown-core-receipts.json" "$WORK_DIR/own-unknown-predecessor-refuted-facts.json" "$WORK_DIR/runtime.json" "$WORK_DIR/inventory.json" "$WORK_DIR/own-unknown-predecessor-refuted-report.json" "$SUBJECT_SHA"
          jq -e '
            .decision=="FAIL_CLOSED" and .claim.state=="REFUTED" and
            ([.cells[]|select(.id=="PRODUCT_PROJECTION" and .state=="REFUTED" and .reason=="DEPENDENCY_REFUTED" and .blocked_by==["META_ACTIVITY_AUTHORITY"])]|length)==1
          ' "$WORK_DIR/own-unknown-predecessor-refuted-report.json" >/dev/null

          jq '.immutable.core_identity_verified=false' "$WORK_DIR/base-facts.json" > "$WORK_DIR/multiple-refuted-facts.json"
          bash scripts/evaluate-released-domain-envelope-v2-adoption.sh "$GITHUB_WORKSPACE" "$WORK_DIR/core-receipts.json" "$WORK_DIR/multiple-refuted-facts.json" "$WORK_DIR/runtime.json" "$WORK_DIR/inventory.json" "$WORK_DIR/multiple-refuted-report.json" "$SUBJECT_SHA"
          jq -e '
            .decision=="FAIL_CLOSED" and
            .claim=={state:"REFUTED",occurrences:0,stage:"DEPENDENCY_RESOLUTION",step:"BLOCKED_BY_REFUTED_PREDECESSOR",reason:"DEPENDENCY_REFUTED",unknown_class:null,next_operation:"RESTORE_REFUTED_PREDECESSOR",blocked_by:["META_ACTIVITY_AUTHORITY"]}
          ' "$WORK_DIR/multiple-refuted-report.json" >/dev/null

          jq '.[0].decision="UNKNOWN"' "$WORK_DIR/core-receipts.json" > "$WORK_DIR/malformed-unknown-core-receipts.json"
          bash scripts/evaluate-released-domain-envelope-v2-adoption.sh "$GITHUB_WORKSPACE" "$WORK_DIR/malformed-unknown-core-receipts.json" "$WORK_DIR/base-facts.json" "$WORK_DIR/runtime.json" "$WORK_DIR/inventory.json" "$WORK_DIR/malformed-unknown-report.json" "$SUBJECT_SHA"
          malformed_decision=$(jq -r '.decision' "$WORK_DIR/malformed-unknown-report.json")
          malformed_refuted_cells=$(jq -r '.summary.cells_refuted' "$WORK_DIR/malformed-unknown-report.json")
          malformed_reason=$(jq -r '.cells[]|select(.id=="CORE_RELEASE")|.reason' "$WORK_DIR/malformed-unknown-report.json")
          malformed_report_sha=$(sha256sum "$WORK_DIR/malformed-unknown-report.json" | awk '{print $1}')
          jq -e '.decision=="FAIL_CLOSED" and .summary.cells_unknown==0 and .summary.cells_refuted>0 and .claim.state=="REFUTED" and ([.cells[]|select(.id=="CORE_RELEASE" and .state=="REFUTED" and .reason=="UNRECOGNIZED_CORE_ACTIVITY_RESOLUTION_DECISION")]|length)==1' "$WORK_DIR/malformed-unknown-report.json" >/dev/null

          jq '.[0].decision="FIXED_POINT"' "$WORK_DIR/core-receipts.json" > "$WORK_DIR/fixed-point-core-receipts.json"
          bash scripts/evaluate-released-domain-envelope-v2-adoption.sh "$GITHUB_WORKSPACE" "$WORK_DIR/fixed-point-core-receipts.json" "$WORK_DIR/base-facts.json" "$WORK_DIR/runtime.json" "$WORK_DIR/inventory.json" "$WORK_DIR/fixed-point-report.json" "$SUBJECT_SHA"
          fixed_point_decision=$(jq -r '.decision' "$WORK_DIR/fixed-point-report.json")
          fixed_point_refuted_cells=$(jq -r '.summary.cells_refuted' "$WORK_DIR/fixed-point-report.json")
          fixed_point_reason=$(jq -r '.cells[]|select(.id=="CORE_RELEASE")|.reason' "$WORK_DIR/fixed-point-report.json")
          fixed_point_report_sha=$(sha256sum "$WORK_DIR/fixed-point-report.json" | awk '{print $1}')
          jq -e --argjson expected_cells "$expected_cells" '.decision=="FAIL_CLOSED" and .summary.cells_closed==0 and .summary.cells_unknown==0 and .summary.cells_refuted==$expected_cells and .claim.state=="REFUTED" and ([.cells[]|select(.id=="CORE_RELEASE" and .state=="REFUTED" and .reason=="UNRECOGNIZED_CORE_ACTIVITY_RESOLUTION_DECISION")]|length)==1' "$WORK_DIR/fixed-point-report.json" >/dev/null

          refuted_paths=$(jq -n --arg malformed "$malformed_decision" --arg fixed_point "$fixed_point_decision" 'if $malformed=="FAIL_CLOSED" and $fixed_point=="FAIL_CLOSED" then 1 else 0 end')
          test "$refuted_paths" -eq "$expected_refuted_paths"
          adversarial_reports_observed=$(jq -n --arg malformed "$malformed_decision" --arg fixed_point "$fixed_point_decision" '[ $malformed, $fixed_point ] | map(select(.=="FAIL_CLOSED")) | length')
          jq -e -n --argjson expected_reports "$expected_refuted_reports" --argjson reports "$adversarial_reports_observed" '$reports==$expected_reports' >/dev/null
          jq --arg unknown_decision "UNOBSERVED" --argjson unknown_cells null --argjson unknown_direct null --argjson unknown_dependency null --argjson unknown_field_count null --argjson unknown_all_six false --arg malformed_decision "$malformed_decision" --argjson malformed_refuted_cells "$malformed_refuted_cells" --arg malformed_reason "$malformed_reason" --arg malformed_report_sha "$malformed_report_sha" --arg fixed_point_decision "$fixed_point_decision" --argjson fixed_point_refuted_cells "$fixed_point_refuted_cells" --arg fixed_point_reason "$fixed_point_reason" --arg fixed_point_report_sha "$fixed_point_report_sha" --argjson adversarial_reports_observed "$adversarial_reports_observed" --argjson refuted_paths "$refuted_paths" '.unknown_coordinates={report_decision:$unknown_decision,cells:$unknown_cells,direct_missing:$unknown_direct,dependency_blocked:$unknown_dependency,six_fields:$unknown_field_count,all_six_fields:$unknown_all_six}|.adversarial={reports_observed:$adversarial_reports_observed,malformed:{decision:$malformed_decision,refuted_cells:$malformed_refuted_cells,reason:$malformed_reason,report_sha256:$malformed_report_sha},fixed_point:{decision:$fixed_point_decision,refuted_cells:$fixed_point_refuted_cells,reason:$fixed_point_reason,report_sha256:$fixed_point_report_sha}}|.user_paths={normal:null,unknown:null,refuted:$refuted_paths}' "$WORK_DIR/base-facts.json" > "$WORK_DIR/adversarial-facts.json"

          missing_activity=$(jq -r '.cells[]|select(.id=="READ_ONLY_CONFORMANCE")|.activity' "$denominator")
