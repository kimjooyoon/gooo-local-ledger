            ${{ env.WORK_DIR }}/base-facts.json
            ${{ env.WORK_DIR }}/swapped-authority-project.json
            ${{ env.WORK_DIR }}/swapped-authority-facts.json
            ${{ env.WORK_DIR }}/swapped-authority-report.json
            ${{ env.WORK_DIR }}/own-unknown-core-receipts.json
            ${{ env.WORK_DIR }}/own-unknown-predecessor-refuted-facts.json
            ${{ env.WORK_DIR }}/own-unknown-predecessor-refuted-report.json
            ${{ env.WORK_DIR }}/multiple-refuted-facts.json
            ${{ env.WORK_DIR }}/multiple-refuted-report.json
            ${{ env.WORK_DIR }}/adversarial-facts.json
            ${{ env.WORK_DIR }}/facts.json
            ${{ env.WORK_DIR }}/final-facts.json
            ${{ env.WORK_DIR }}/runtime.json
