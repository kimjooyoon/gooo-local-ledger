          unknown_all_six=$(jq -r --argjson fields "$expected_unknown_fields" '(([.cells[]|select(.state=="UNKNOWN")][0]//{}) as $sample | (["stage","step","reason","unknown_class","next_operation","blocked_by"] | map(. as $key | select($sample|has($key))) | length)==$fields)' "$WORK_DIR/unknown-report.json")
          jq -e --arg expected_decision "RELEASED_DOMAIN_ENVELOPE_V2_UNKNOWN" --argjson expected_cases "$expected_unknown_cases" --argjson expected_fields "$expected_unknown_fields" --argjson expected_direct "$expected_unknown_direct" --argjson expected_dependency "$expected_unknown_dependency" --argjson cells "$unknown_cells" --argjson direct "$unknown_direct" --argjson dependency "$unknown_dependency" --argjson fields "$unknown_field_count" --argjson all_six "$unknown_all_six" '.decision==$expected_decision and .claim.state=="UNKNOWN" and .claim.unknown_class=="DIRECT_MISSING" and .claim.blocked_by==[] and $cells==$expected_cases and $direct==$expected_direct and $dependency==$expected_dependency and $fields==$expected_fields and $all_six==true and .summary.cells_unknown==$cells and .summary.cells_refuted==0 and ([.cells[]|select(.state=="UNKNOWN")|{id,unknown_class,blocked_by}]|sort_by(.id))==[{id:"READ_ONLY_CONFORMANCE",unknown_class:"DIRECT_MISSING",blocked_by:[]},{id:"UNKNOWN_CAUSALITY",unknown_class:"DEPENDENCY_BLOCKED",blocked_by:["READ_ONLY_CONFORMANCE"]}] and all(.cells[]; (.state!="UNKNOWN") or (.occurrences==0 and (.stage|type)=="string" and (.step|type)=="string" and (.reason|type)=="string" and (.unknown_class|IN("DIRECT_MISSING","DEPENDENCY_BLOCKED")) and (.next_operation|type)=="string" and (.blocked_by|type)=="array" and ((.unknown_class=="DIRECT_MISSING" and .reason=="ACTIVITY_NOT_FOUND" and (.blocked_by|length)==0) or (.unknown_class=="DEPENDENCY_BLOCKED" and .reason=="DEPENDENCY_BLOCKED" and (.blocked_by|length)>0))))' "$WORK_DIR/unknown-report.json" >/dev/null

          unknown_report_sha=$(sha256sum "$WORK_DIR/unknown-report.json" | awk '{print $1}')
          jq --arg unknown_decision "$unknown_decision" --argjson unknown_cells "$unknown_cells" --argjson unknown_direct "$unknown_direct" --argjson unknown_dependency "$unknown_dependency" --argjson unknown_field_count "$unknown_field_count" --argjson unknown_all_six "$unknown_all_six" --arg unknown_report_sha "$unknown_report_sha" '.unknown_coordinates={report_decision:$unknown_decision,cells:$unknown_cells,direct_missing:$unknown_direct,dependency_blocked:$unknown_dependency,six_fields:$unknown_field_count,all_six_fields:$unknown_all_six,report_sha256:$unknown_report_sha}|.source_artifacts.unknown_report_sha256=$unknown_report_sha|.user_paths.unknown=$unknown_cells' "$WORK_DIR/adversarial-facts.json" > "$WORK_DIR/facts.json"

          bash scripts/evaluate-released-domain-envelope-v2-adoption.sh "$GITHUB_WORKSPACE" "$WORK_DIR/core-receipts.json" "$WORK_DIR/facts.json" "$WORK_DIR/runtime.json" "$WORK_DIR/inventory.json" "$WORK_DIR/normal-preliminary-report.json" "$SUBJECT_SHA"
          normal_paths=$(jq -r 'if .decision=="RELEASED_DOMAIN_ENVELOPE_V2_CANDIDATE_CLOSED" and .summary.cells_closed==.summary.cells_total then 1 else 0 end' "$WORK_DIR/normal-preliminary-report.json")
          test "$normal_paths" -eq "$expected_normal_paths"
          normal_report_sha=$(sha256sum "$WORK_DIR/normal-preliminary-report.json" | awk '{print $1}')
          jq --argjson normal_paths "$normal_paths" --arg normal_report_sha "$normal_report_sha" '.user_paths.normal=$normal_paths|.source_artifacts.normal_report_sha256=$normal_report_sha' "$WORK_DIR/facts.json" > "$WORK_DIR/final-facts.json"

          if ! bash scripts/evaluate-released-domain-envelope-v2-adoption.sh "$GITHUB_WORKSPACE" "$WORK_DIR/core-receipts.json" "$WORK_DIR/final-facts.json" "$WORK_DIR/runtime.json" "$WORK_DIR/inventory.json" "$WORK_DIR/adoption-report.json" "$SUBJECT_SHA" > "$WORK_DIR/evaluator-stdout.log" 2> "$WORK_DIR/evaluator-stderr.log"; then
            echo "released-domain envelope evaluator failed" >&2
            cat "$WORK_DIR/evaluator-stderr.log" >&2
            exit 1
          fi
          jq -e --argjson expected_cells "$expected_cells" --argjson expected_projection "$expected_projection" --argjson expected_files "$expected_files" --argjson expected_relations "$expected_relations" --argjson expected_checks "$expected_checks" --argjson expected_source_replay "$expected_source_replay" --argjson expected_file_replay "$expected_file_replay" --argjson expected_unknown_cases "$expected_unknown_cases" --argjson expected_unknown_direct "$expected_unknown_direct" --argjson expected_unknown_dependency "$expected_unknown_dependency" --argjson expected_refuted_reports "$expected_refuted_reports" --argjson expected_normal_paths "$expected_normal_paths" --argjson expected_refuted_paths "$expected_refuted_paths" --argjson expected_unknown_fields "$expected_unknown_fields" --argjson expected_source_artifacts "$expected_source_artifacts" '
            .decision=="RELEASED_DOMAIN_ENVELOPE_V2_CANDIDATE_CLOSED" and .claim.state=="CLOSED" and .claim.unknown_class==null and .claim.blocked_by==[] and
            .summary.cells_total==$expected_cells and .summary.cells_closed==$expected_cells and .summary.cells_unknown==0 and .summary.cells_refuted==0 and
            .summary.normal_cases==$expected_normal_paths and .summary.unknown_cases==0 and .summary.refuted_cases==0 and
