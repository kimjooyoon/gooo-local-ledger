          bash scripts/evaluate-released-domain-envelope-v2-adoption.sh "$GITHUB_WORKSPACE" "$WORK_DIR/missing-receipt-core-receipts.json" "$WORK_DIR/adversarial-facts.json" "$WORK_DIR/runtime.json" "$WORK_DIR/inventory.json" "$WORK_DIR/unknown-report.json" "$SUBJECT_SHA"
          unknown_decision=$(jq -r '.decision' "$WORK_DIR/unknown-report.json")
          unknown_cells=$(jq '[.cells[]|select(.state=="UNKNOWN")]|length' "$WORK_DIR/unknown-report.json")
          unknown_direct=$(jq '[.cells[]|select(.state=="UNKNOWN" and .unknown_class=="DIRECT_MISSING")]|length' "$WORK_DIR/unknown-report.json")
