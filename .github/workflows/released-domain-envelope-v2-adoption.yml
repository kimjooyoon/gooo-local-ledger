            .summary.generated_artifacts_observed==$expected_files and .summary.generated_artifacts_total==$expected_files and
            .summary.product_owned_projection==$expected_projection and .summary.product_owned_projection_total==$expected_projection and
            .summary.envelope_files==$expected_files and .summary.envelope_files_total==$expected_files and
            .summary.relations==$expected_relations and .summary.relations_total==$expected_relations and .summary.evidence==$expected_relations and .summary.evidence_total==$expected_relations and .summary.resolutions==$expected_relations and .summary.resolutions_total==$expected_relations and
            .summary.conformer_checks==$expected_checks and .summary.conformer_checks_total==$expected_checks and .summary.deterministic_replay==$expected_source_replay and .summary.deterministic_replay_total==$expected_source_replay and .summary.file_replay_comparisons_observed==$expected_file_replay and .summary.file_replay_comparisons_total==$expected_file_replay and
            .summary.source_project_plan_artifacts_observed==$expected_source_artifacts and .summary.source_project_plan_artifacts_total==$expected_source_artifacts and
            .cases=={normal:$expected_normal_paths,unknown:$expected_unknown_cases,refuted:$expected_refuted_paths} and .unknown_classes=={direct_missing:$expected_unknown_direct,dependency_blocked:$expected_unknown_dependency,total:$expected_unknown_cases,fields:["stage","step","reason","unknown_class","next_operation","blocked_by"]} and
            .adversarial.reports_observed==$expected_refuted_reports and .adversarial.malformed.decision=="FAIL_CLOSED" and .adversarial.fixed_point.decision=="FAIL_CLOSED" and .adversarial.malformed.reason=="UNRECOGNIZED_CORE_ACTIVITY_RESOLUTION_DECISION" and .adversarial.fixed_point.reason=="UNRECOGNIZED_CORE_ACTIVITY_RESOLUTION_DECISION" and
            .adoption.released_domain_adoption=={observed:0,total:1,state:"UNKNOWN"} and .adoption.external_utility.observed==0 and .adoption.external_utility.total==1 and .adoption.external_utility.state=="UNKNOWN" and
            .authority.envelope_semantic_authority=="INTERCHANGE_SPECIFICATION" and .authority.projection_implementation_owner=="LOCAL_LEDGER" and
            .authority.repository_writes==0 and .authority.local_test_executions==0 and .authority.cross_project_required_gates==0 and .metrics.wall_ms>0 and .metrics.peak_rss_kib>0 and
            ([.proof_counts[]|select(.observed==4 and .total==4)]|length)==3 and ([.indicator_counts[]|select(.observed==4 and .total==4)]|length)==3
          ' "$WORK_DIR/adoption-report.json" >/dev/null

          {
            echo "## Released-domain envelope v2 adoption candidate"
            jq -r '"- product-owned projection: \(.summary.product_owned_projection)/\(.summary.product_owned_projection_total)","- envelope files: \(.summary.envelope_files)/\(.summary.envelope_files_total)","- relations/evidence/resolutions: \(.summary.relations)/\(.summary.relations_total)/\(.summary.evidence)/\(.summary.evidence_total)/\(.summary.resolutions)/\(.summary.resolutions_total)","- conformer checks: \(.summary.conformer_checks)/\(.summary.conformer_checks_total)","- source replay: \(.summary.deterministic_replay)/\(.summary.deterministic_replay_total)","- file replay comparisons: \(.summary.file_replay_comparisons_observed)/\(.summary.file_replay_comparisons_total)","- released adoption: \(.adoption.released_domain_adoption.observed)/\(.adoption.released_domain_adoption.total) \(.adoption.released_domain_adoption.state)","- external utility: \(.adoption.external_utility.observed)/\(.adoption.external_utility.total) \(.adoption.external_utility.state)","- normal/UNKNOWN/REFUTED cases: \(.cases.normal)/\(.cases.unknown)/\(.cases.refuted)","- Gooo meta activities: \(.summary.meta_activities_observed)/\(.summary.meta_activities_total)","- generated artifacts: \(.summary.generated_artifacts_observed)/\(.summary.generated_artifacts_total)","- user paths: \(.summary.user_paths_observed)/\(.summary.user_paths_total)","- repository writes/local tests/cross-project gates: \(.summary.repository_writes)/\(.summary.local_test_executions)/\(.summary.cross_project_required_gates)","- Go files/lines: \(.metrics.go_files)/\(.metrics.go_lines)","- Gooo files/lines: \(.metrics.gooo_files)/\(.metrics.gooo_lines)","- regular files/directories: \(.metrics.regular_files)/\(.metrics.descendant_directories)","- peak RSS/wall: \(.metrics.peak_rss_kib) KiB/\(.metrics.wall_ms) ms"' "$WORK_DIR/adoption-report.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload adoption evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: local-ledger-released-domain-envelope-v2-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            ${{ env.WORK_DIR }}/bundle-a
            ${{ env.WORK_DIR }}/bundle-b
